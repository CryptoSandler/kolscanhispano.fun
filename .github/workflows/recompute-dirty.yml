name: Recompute dirty positions

# Replays every dirty position's trade log into position and pnl_daily. See
# src/lib/pnl.ts's recomputeDirty, run here through
# scripts/recompute-dirty.ts.
#
# Then prunes rate_limit, through scripts/prune-rate-limit.ts. That job is
# here rather than in parse-pending.yml because parsing is the ingestion
# critical path and a failure to delete week-old counters has no business
# standing between a webhook and a trade; it is the SECOND step here for the
# mirror of the same reason, so a prune failure cannot prevent a recompute
# either. It has no cadence needs of its own -- the retention is seven days,
# so any cron that runs at all is often enough -- and the two scripts take
# different advisory locks, so neither can block the other.
#
# This runs the work directly on a GitHub-hosted runner instead of calling an
# HTTP endpoint: outbid-tokens' reconcile workflow calls an endpoint because
# its work lives in a deployed app and Vercel Cron cannot send an auth
# header. Here nothing is deployed and nothing may be deployed this batch,
# and recomputeDirty is pure database work with no HTTP surface — a runner
# with DATABASE_URL does the work directly, with no endpoint to authenticate
# and no deployment to depend on.

on:
  schedule:
    # Every 15 minutes. GitHub's scheduler is best-effort and can run late
    # under load, so treat this as "roughly every 15 minutes". Nothing here
    # is time-critical: recomputeDirty rebuilds each position from its full
    # trade log every time (spec §4.10), so a late run does exactly what a
    # punctual one would — it just has more positions marked dirty to get
    # through.
    - cron: "*/15 * * * *"
  workflow_dispatch:

# The GITHUB_TOKEN this workflow gets, declared at workflow level so it
# covers every job and step rather than whichever one someone remembers.
# Undeclared, it is whatever the repository default grants -- which on a
# public repo can be write-scoped -- handed to a job that only checks out
# code and connects to Neon. Nothing here uses the token for anything but
# the checkout, and `contents: read` is exactly what the checkout needs.
permissions:
  contents: read

# A run that is still going when the next schedule fires should finish, not
# be raced. scripts/recompute-dirty.ts also takes its own advisory lock
# (withLock) for exactly this case — this concurrency group just avoids
# spinning up a second runner that would only find that lock held and exit.
concurrency:
  group: recompute-dirty
  cancel-in-progress: false

jobs:
  recompute-dirty:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Pinned to a commit, with the tag it was in the comment beside it. A
      # moving tag is a promise from whoever can move it: `v4` is a branch-like
      # ref the action's owner (or anyone who takes that account) can repoint at
      # any commit, and this job holds DATABASE_URL and, in the steps below,
      # both WALLET_* keys. Resolved 2026-08-28: refs/tags/v4 and refs/tags/
      # v4.4.0 pointed at the same commit in both repositories.
      #
      # `persist-credentials: false` because the default writes the job's
      # GITHUB_TOKEN into .git/config, where it stays readable by every step
      # that follows -- `npm ci` and every `npx tsx` below it. Nothing in this
      # workflow pushes, so nothing needs the token after the fetch.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      # --ignore-scripts because a dependency's install script runs in this job,
      # with this job's environment, before any of the steps that were reasoned
      # about -- and the steps below hand it DATABASE_URL, WALLET_ENC_KEY and
      # WALLET_HMAC_KEY. Four packages in this lockfile declare one (esbuild,
      # fsevents twice, unrs-resolver) and none of them is needed to run
      # anything here: verified 2026-08-28 by installing this exact lockfile
      # with the flag into a clean directory, where `npx tsx` and `require("pg")`
      # both work.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run recomputeDirty
        env:
          # Repository secrets — see Task 2's report for what each is for.
          # Never echoed: only checked for emptiness below.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WALLET_ENC_KEY: ${{ secrets.WALLET_ENC_KEY }}
          WALLET_HMAC_KEY: ${{ secrets.WALLET_HMAC_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL is not set. Add it under Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi
          if [ -z "${WALLET_ENC_KEY}" ]; then
            echo "::error::WALLET_ENC_KEY is not set. Add it under Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi
          if [ -z "${WALLET_HMAC_KEY}" ]; then
            echo "::error::WALLET_HMAC_KEY is not set. Add it under Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi

          npx tsx scripts/recompute-dirty.ts

      - name: Prune expired rate_limit rows
        env:
          # DATABASE_URL only, unlike every other step in this repo, and that
          # is the accurate list rather than a shortened one: the script's
          # whole import graph is env.ts, lock.ts, lock-key.ts, db.ts and
          # rate-limit.ts, and the only WALLET_* read among them is inside
          # rate-limit.ts's ipHash -- which pruneRateLimit never calls.
          # wallets.ts, the module that asserts both keys at load time, is
          # not on that graph at all. Handing this step keys it cannot use
          # would only widen what a compromised step could exfiltrate.
          #
          # The emptiness guard lives on the recompute step above, which runs
          # first in the same job with the same secret: if DATABASE_URL were
          # missing, this step would never be reached.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          npx tsx scripts/prune-rate-limit.ts
