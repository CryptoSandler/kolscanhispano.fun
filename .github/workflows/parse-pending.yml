name: Parse pending trades

# Turns stored webhook payloads into trade rows and marks the positions they
# touch dirty. See src/lib/parse-swap.ts's parsePending, run here through
# scripts/parse-pending.ts.
#
# It is preceded by scripts/backfill-sol-price.ts, which gives sol_price a row
# for every minute of the last three hours from Binance's public 1-minute
# klines, and by the requeue below it; and followed by
# scripts/backfill-prices.ts, which prices the trades the parse just wrote.
# Two writers of sol_price and two different questions, which is why the fill
# is in front and the pricing behind:
#
#   - IN FRONT, because parse-swap.ts's solUsdForMinute asks for the block's
#     OWN minute (`minute = ...`, not `<=`) when it normalises a
#     stablecoin-quoted swap to SOL -- that rate becomes the cost basis, not a
#     display figure -- and a miss there is a refusal that writes parse_error
#     and takes the row out of the pending queue for good. Rates for a minute
#     have to exist BEFORE the parse reads it, and refreshSolPrice alone could
#     never provide them: it writes one row, at the current minute, once per
#     run, so four minutes in five had no row at all by construction.
#
#   - BEHIND, because backfill-prices.ts is the only thing that revisits a
#     trade -- nothing ever revisits a parsed raw_tx row -- so it has to run
#     after the rows it is meant to price exist. Its own opening act is
#     refreshSolPrice, one free DexScreener request, which covers the CURRENT
#     minute: the one minute the Binance fill deliberately leaves alone,
#     because a candle still in progress has a close that keeps moving and the
#     fill's ON CONFLICT DO NOTHING would freeze it. usd_amount is filled
#     through solUsdAt's `minute <= block_time` bound, which tolerates a stale
#     rate precisely because it only re-renders an already-exact SOL figure.
#
# A rate is never back-dated onto a trade that happened before it (spec 4.1:
# USD is the value at trade time, never re-priced), so trades older than the
# earliest sol_price row stay NULL permanently and the backfill counts them
# out loud.
#
# Between the fill and the parse sits the requeue, scripts/requeue-no-rate.ts:
# a single UPDATE (parse-swap.ts's requeueNoRate) that clears parse_error on
# the rows the parse refused for a rate their minute now has.
# The fill takes roughly nine in ten future refusals before they happen; this
# is what reaches the residue the fill structurally cannot, the swaps whose
# block minute was still the CURRENT minute when the parse read it. Its own
# reasoning is on the step.
#
# Then a third step, scripts/refresh-token-metadata.ts, gives the mints those
# trades name a symbol. It is here, and last, for two separate reasons. Here,
# because a mint becomes worth resolving the moment a trade names it, which is
# this workflow's cadence and no other's. Last, because a step that fails
# stops the ones behind it: a metadata refresh that cannot reach DexScreener
# must not be able to stand between a webhook and a trade, nor between a trade
# and its USD value. Symbols are what the feed shows; the two steps above are
# what it is showing.
#
# The five scripts take different advisory locks, so a later one cannot be
# blocked by an earlier one, and each exits non-zero on its own failure. The
# requeue does not need its lock -- it is one idempotent statement, and the
# rows it touches are exactly the ones the parse's pending query excludes --
# and takes one anyway, so every cron in this repo has one shape; see the
# script. Only the first step is marked continue-on-error, for the reason
# stated on it.
#
# This runs the work directly on a GitHub-hosted runner instead of calling an
# HTTP endpoint: outbid-tokens' reconcile workflow calls an endpoint because
# its work lives in a deployed app and Vercel Cron cannot send an auth
# header. Here nothing is deployed and nothing may be deployed this batch,
# and parsePending is pure database work with no HTTP surface — a runner
# with DATABASE_URL does the work directly, with no endpoint to authenticate
# and no deployment to depend on.

on:
  schedule:
    # Every 5 minutes. GitHub's scheduler is best-effort and can run late
    # under load, so treat this as "roughly every 5 minutes". Nothing here is
    # time-critical: parsePending derives every trade from whatever raw_tx
    # rows are currently pending, so a late run does exactly what a punctual
    # one would.
    - cron: "*/5 * * * *"
  workflow_dispatch:

# The GITHUB_TOKEN this workflow gets, declared at workflow level so it
# covers every job and step rather than whichever one someone remembers.
# Undeclared, it is whatever the repository default grants -- which on a
# public repo can be write-scoped -- handed to a job that only checks out
# code and connects to Neon. Nothing here uses the token for anything but
# the checkout, and `contents: read` is exactly what the checkout needs.
permissions:
  contents: read

# A run that is still going when the next schedule fires should finish, not
# be raced. scripts/parse-pending.ts also takes its own advisory lock
# (withLock) for exactly this case — this concurrency group just avoids
# spinning up a second runner that would only find that lock held and exit.
concurrency:
  group: parse-pending
  cancel-in-progress: false

jobs:
  parse-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      # First, and before the parse, which is the property this step has --
      # see scripts/backfill-sol-price.ts for the full reasoning.
      #
      # parsePending refuses a stablecoin-quoted swap whose block minute has
      # no sol_price row (unsupported_quote_no_rate) and writes parse_error,
      # which takes the row OUT of the pending queue: `WHERE parsed_at IS NULL
      # AND parse_error IS NULL`. Nothing in this repository clears that
      # column, so in practice that refusal is permanent, not deferred. A fill
      # that ran after the parse would write the exact minute the parse had
      # just declined, one cycle too late, for a row nothing looks at again.
      #
      # `continue-on-error: true` is the other half of it, and it is not
      # timidity. This repo's own rule is that a step which fails stops the
      # ones behind it, and that nothing optional may stand between a webhook
      # and a trade (see the metadata step below, which is last for exactly
      # that reason). Putting a third-party HTTP call in FRONT of the parse
      # inverts that -- a Binance outage or a 429 would stop ingestion
      # entirely. So the step keeps an honest exit code (the script exits 1 on
      # a real failure and that shows in the Actions UI), and the job carries
      # on to the parse regardless. What is lost when it fails is one cycle of
      # rates, which the next run's 180-minute window fills back in.
      #
      # DATABASE_URL only, of the three secrets, and that is the accurate list
      # rather than a shortened one: this script's import graph is env.ts,
      # lock.ts, lock-key.ts, db.ts, prices.ts, decimal.ts and mints.ts, with
      # no wallets.ts on it, so neither WALLET_* key is readable by anything it
      # runs. Handing this step keys it cannot use would only widen what a
      # compromised step could exfiltrate. Binance's klines endpoint is public
      # and keyless, so there is no third secret to add here either.
      #
      # The emptiness guards for all three secrets live on the parse step
      # below rather than being duplicated here: without DATABASE_URL this
      # step fails on its own and is then skipped past by continue-on-error,
      # and the parse step -- which must stop -- states the diagnosis once.
      - name: Fill sol_price for the minutes about to be parsed
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          npx tsx scripts/backfill-sol-price.ts

      # Between the fill and the parse, which is the only position that does
      # any good. requeueNoRate (src/lib/parse-swap.ts, run here through
      # scripts/requeue-no-rate.ts) clears parse_error on the
      # `unsupported_quote_no_rate` rows whose block minute the step above has
      # just given a usable rate, and the parse below is what turns them into
      # trades. Behind the parse it would open rows nothing looks at until the
      # next cycle; in front of the fill it would find the same minutes still
      # empty and clear nothing.
      #
      # It is gated on `usd > 0`, not on the minute merely existing, and that
      # is the whole shape of it: evaluateSwap refuses a non-positive rate, so
      # a gate that only asked whether the row was there would clear a row
      # whose minute holds a zero, watch the parse refuse it again, and clear
      # it again -- at the HEAD of parsePending's `ORDER BY received_at`
      # queue, since a requeued row keeps its original received_at. Migration
      # 009 makes the zero unrepresentable; the predicate survives it anyway.
      #
      # No continue-on-error, unlike the step above, and the difference is
      # what each one talks to. The fill is a third-party HTTP call that must
      # not be able to stop ingestion. This is one statement against the same
      # database the parse is about to use: a failure here is a failure the
      # parse would meet anyway, one step later, and it must stop.
      #
      # DATABASE_URL only, and that is the accurate list rather than a
      # shortened one. This script's import graph reaches parse-swap.ts, which
      # decrypts payloads -- but crypto.ts loads its keys per call rather than
      # at import, and nothing on this path decrypts anything: the minute the
      # gate reads is raw_tx.block_time, a plaintext column the webhook writes
      # from the same payload.timestamp the parser reads. Verified 2026-08-26
      # by running the script with both of the repo's wallet key variables set
      # to garbage values. Handing this step keys it cannot use would only
      # widen what a compromised step could exfiltrate.
      - name: Requeue rows whose missing rate has since arrived
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Optional bound on how many rows one run releases. Unset means the
          # library default, which is parsePending's own LIMIT -- releasing
          # more than the parse behind it can examine only moves rows to the
          # front of a queue that drains at that rate anyway. Set it as a
          # repository *variable* for a one-off larger drain after a
          # historical sol_price import, or to 0 to stop this step without
          # editing the workflow. Either way the run says how many rows it
          # left still eligible.
          REQUEUE_LIMIT: ${{ vars.REQUEUE_LIMIT }}
        run: |
          set -euo pipefail
          npx tsx scripts/requeue-no-rate.ts

      - name: Run parsePending
        env:
          # Repository secrets — see Task 2's report for what each is for.
          # Never echoed: only checked for emptiness below.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WALLET_ENC_KEY: ${{ secrets.WALLET_ENC_KEY }}
          WALLET_HMAC_KEY: ${{ secrets.WALLET_HMAC_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL is not set. Add it under Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi
          if [ -z "${WALLET_ENC_KEY}" ]; then
            echo "::error::WALLET_ENC_KEY is not set. Add it under Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi
          if [ -z "${WALLET_HMAC_KEY}" ]; then
            echo "::error::WALLET_HMAC_KEY is not set. Add it under Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi

          npx tsx scripts/parse-pending.ts

      - name: Price the trades it wrote
        env:
          # Same three secrets. backfill-prices.ts reads DATABASE_URL through
          # db.ts and decrypts nothing, but wallets.ts is on its import graph
          # and asserts both keys at load time.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WALLET_ENC_KEY: ${{ secrets.WALLET_ENC_KEY }}
          WALLET_HMAC_KEY: ${{ secrets.WALLET_HMAC_KEY }}
        run: |
          set -euo pipefail
          npx tsx scripts/backfill-prices.ts

      - name: Refresh token metadata
        env:
          # DATABASE_URL only, of the three, and that is the accurate list
          # rather than a shortened one: this script's whole import graph is
          # env.ts, lock.ts, lock-key.ts, db.ts, prices.ts, decimal.ts and
          # mints.ts, and wallets.ts -- the module that asserts both WALLET_*
          # keys at load time -- is not on it. Handing this step keys it
          # cannot use would only widen what a compromised step could
          # exfiltrate. The emptiness guard for DATABASE_URL lives on the
          # parse step above, which runs first in the same job with the same
          # secret: if it were missing, this step would never be reached.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Optional, and the guard below is a ::warning:: rather than an
          # ::error:: for that reason -- read this before "fixing" the
          # inconsistency with the three checks above.
          #
          # The difference is what the step can still do without the value.
          # Without DATABASE_URL there is no work at all, so the run stops
          # (::error:: + exit 1). Without HELIUS_API_KEY the run does almost
          # all of its work: DexScreener supplies the symbol for every mint it
          # knows, which is nearly all of them, for free and with no key. What
          # is lost is only the DAS fallback for the mints DexScreener has
          # never heard of -- those rows keep symbol = NULL, which the feed
          # already renders as "un token sin simbolo" rather than a ticker
          # (verified 2026-08-26: src/app/feed-live.tsx:185). Failing over that
          # would turn a partial answer into no answer, and would put a
          # metadata step in front of a cron whose real job is ingestion.
          #
          # Adding the secret is what turns the fallback on; nothing else has
          # to change. Note that a mint already written with symbol = NULL is
          # only re-asked once its 24h retry interval has passed (see the
          # script's header), so give it a day to catch up.
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          # Optional bound on how many mints one run resolves. Unset means the
          # script's own default of 30 -- one DexScreener request per run. Set
          # it as a repository *variable* for a one-off larger drain, or to 0
          # to stop this step without editing the workflow.
          TOKEN_METADATA_LIMIT: ${{ vars.TOKEN_METADATA_LIMIT }}
        run: |
          set -euo pipefail

          if [ -z "${HELIUS_API_KEY}" ]; then
            echo "::warning::HELIUS_API_KEY is not set, so the Helius DAS fallback is skipped. DexScreener still supplies a symbol for every mint it knows; a mint it does not know keeps symbol = NULL, which the feed renders as its no-symbol wording rather than a ticker. This is a warning, not an error: the fallback is optional and this step continues without it. Add it under Settings -> Secrets and variables -> Actions -> Repository secrets to enable it."
          fi

          npx tsx scripts/refresh-token-metadata.ts
