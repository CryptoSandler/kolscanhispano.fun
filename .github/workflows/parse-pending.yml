name: Parse pending trades

# Turns stored webhook payloads into trade rows and marks the positions they
# touch dirty. See src/lib/parse-swap.ts's parsePending, run here through
# scripts/parse-pending.ts.
#
# Then prices what it just wrote, through scripts/backfill-prices.ts. The two
# steps are one workflow because they are one cadence and one dependency:
# insertTrade values a trade from the newest sol_price row at or before its
# block time, and nothing else writes sol_price, so without a rate writer on
# the parser's own cadence every new trade is recorded with a NULL
# usd_amount -- which is the state the whole table was in. The backfill's
# first act is refreshSolPrice: one free DexScreener request, no Helius
# credits, no key.
#
# What that refresh actually reaches, stated precisely because an earlier
# version of this comment overstated it: refreshSolPrice writes ONE row, at
# the CURRENT minute, and solUsdAt bounds its search at
# `minute <= block_time`. So this run's refresh covers only a trade whose
# block time falls in that same minute. Every other trade -- which is nearly
# all of them -- is filled from a row an EARLIER run wrote. That is what the
# cadence buys: after the first cycle sol_price carries a row every five
# minutes, so each new trade lands after one of them and is filled by the
# next run at the latest. A rate is never back-dated onto a trade that
# happened before it (spec 4.1: USD is the value at trade time, never
# re-priced), so trades older than the very first sol_price row stay NULL
# permanently and the backfill counts them out loud.
#
# The order is parse-then-backfill and not the reverse. The backfill is the
# only thing that revisits a trade -- nothing ever revisits a parsed raw_tx
# row -- so it has to run after the rows it is meant to price exist.
#
# Then a third step, scripts/refresh-token-metadata.ts, gives the mints those
# trades name a symbol. It is here, and last, for two separate reasons. Here,
# because a mint becomes worth resolving the moment a trade names it, which is
# this workflow's cadence and no other's. Last, because a step that fails
# stops the ones behind it: a metadata refresh that cannot reach DexScreener
# must not be able to stand between a webhook and a trade, nor between a trade
# and its USD value. Symbols are what the feed shows; the two steps above are
# what it is showing.
#
# The three scripts take different advisory locks, so a later one cannot be
# blocked by an earlier one, and each exits non-zero on its own failure.
#
# This runs the work directly on a GitHub-hosted runner instead of calling an
# HTTP endpoint: outbid-tokens' reconcile workflow calls an endpoint because
# its work lives in a deployed app and Vercel Cron cannot send an auth
# header. Here nothing is deployed and nothing may be deployed this batch,
# and parsePending is pure database work with no HTTP surface — a runner
# with DATABASE_URL does the work directly, with no endpoint to authenticate
# and no deployment to depend on.

on:
  schedule:
    # Every 5 minutes. GitHub's scheduler is best-effort and can run late
    # under load, so treat this as "roughly every 5 minutes". Nothing here is
    # time-critical: parsePending derives every trade from whatever raw_tx
    # rows are currently pending, so a late run does exactly what a punctual
    # one would.
    - cron: "*/5 * * * *"
  workflow_dispatch:

# The GITHUB_TOKEN this workflow gets, declared at workflow level so it
# covers every job and step rather than whichever one someone remembers.
# Undeclared, it is whatever the repository default grants -- which on a
# public repo can be write-scoped -- handed to a job that only checks out
# code and connects to Neon. Nothing here uses the token for anything but
# the checkout, and `contents: read` is exactly what the checkout needs.
permissions:
  contents: read

# A run that is still going when the next schedule fires should finish, not
# be raced. scripts/parse-pending.ts also takes its own advisory lock
# (withLock) for exactly this case — this concurrency group just avoids
# spinning up a second runner that would only find that lock held and exit.
concurrency:
  group: parse-pending
  cancel-in-progress: false

jobs:
  parse-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install dependencies
        run: npm ci

      - name: Run parsePending
        env:
          # Repository secrets — see Task 2's report for what each is for.
          # Never echoed: only checked for emptiness below.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WALLET_ENC_KEY: ${{ secrets.WALLET_ENC_KEY }}
          WALLET_HMAC_KEY: ${{ secrets.WALLET_HMAC_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL is not set. Add it under Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi
          if [ -z "${WALLET_ENC_KEY}" ]; then
            echo "::error::WALLET_ENC_KEY is not set. Add it under Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi
          if [ -z "${WALLET_HMAC_KEY}" ]; then
            echo "::error::WALLET_HMAC_KEY is not set. Add it under Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi

          npx tsx scripts/parse-pending.ts

      - name: Price the trades it wrote
        env:
          # Same three secrets. backfill-prices.ts reads DATABASE_URL through
          # db.ts and decrypts nothing, but wallets.ts is on its import graph
          # and asserts both keys at load time.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WALLET_ENC_KEY: ${{ secrets.WALLET_ENC_KEY }}
          WALLET_HMAC_KEY: ${{ secrets.WALLET_HMAC_KEY }}
        run: |
          set -euo pipefail
          npx tsx scripts/backfill-prices.ts

      - name: Refresh token metadata
        env:
          # DATABASE_URL only, of the three, and that is the accurate list
          # rather than a shortened one: this script's whole import graph is
          # env.ts, lock.ts, lock-key.ts, db.ts, prices.ts, decimal.ts and
          # mints.ts, and wallets.ts -- the module that asserts both WALLET_*
          # keys at load time -- is not on it. Handing this step keys it
          # cannot use would only widen what a compromised step could
          # exfiltrate. The emptiness guard for DATABASE_URL lives on the
          # parse step above, which runs first in the same job with the same
          # secret: if it were missing, this step would never be reached.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Optional, and the guard below is a ::warning:: rather than an
          # ::error:: for that reason -- read this before "fixing" the
          # inconsistency with the three checks above.
          #
          # The difference is what the step can still do without the value.
          # Without DATABASE_URL there is no work at all, so the run stops
          # (::error:: + exit 1). Without HELIUS_API_KEY the run does almost
          # all of its work: DexScreener supplies the symbol for every mint it
          # knows, which is nearly all of them, for free and with no key. What
          # is lost is only the DAS fallback for the mints DexScreener has
          # never heard of -- those rows keep symbol = NULL, which the feed
          # already renders as "un token sin simbolo" rather than a ticker
          # (verified 2026-08-26: src/app/feed-live.tsx:185). Failing over that
          # would turn a partial answer into no answer, and would put a
          # metadata step in front of a cron whose real job is ingestion.
          #
          # Adding the secret is what turns the fallback on; nothing else has
          # to change. Note that a mint already written with symbol = NULL is
          # only re-asked once its 24h retry interval has passed (see the
          # script's header), so give it a day to catch up.
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          # Optional bound on how many mints one run resolves. Unset means the
          # script's own default of 30 -- one DexScreener request per run. Set
          # it as a repository *variable* for a one-off larger drain, or to 0
          # to stop this step without editing the workflow.
          TOKEN_METADATA_LIMIT: ${{ vars.TOKEN_METADATA_LIMIT }}
        run: |
          set -euo pipefail

          if [ -z "${HELIUS_API_KEY}" ]; then
            echo "::warning::HELIUS_API_KEY is not set, so the Helius DAS fallback is skipped. DexScreener still supplies a symbol for every mint it knows; a mint it does not know keeps symbol = NULL, which the feed renders as its no-symbol wording rather than a ticker. This is a warning, not an error: the fallback is optional and this step continues without it. Add it under Settings -> Secrets and variables -> Actions -> Repository secrets to enable it."
          fi

          npx tsx scripts/refresh-token-metadata.ts
